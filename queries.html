<!doctype html><html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nạp bộ câu hỏi — KIS Checker</title><link rel="stylesheet" href="app.css"></head><body>
<div class="wrap">
  <div class="nav" id="nav"></div>
  <h1 style="margin-top:18px">Nạp bộ câu hỏi</h1>
  <div class="sub">Dán nguyên đề thi vào — hệ thống tự tách thành từng query</div>

  <div class="card">
    <div class="row"><b style="font-size:13px">Nạp vào vòng:</b><span id="rsw" class="pick"></span></div>
    <label class="fld"><span>Dán toàn bộ nội dung đề (giữ nguyên, không cần cắt gọt)</span>
      <textarea id="raw" placeholder="Câu `query-p1-1-kis`&#10;Đây là phần giới thiệu…"></textarea></label>
    <div class="row" style="margin-top:12px">
      <button class="btn primary" id="parse">Tách câu hỏi</button>
      <button class="btn danger" id="wipe">🗑 Xoá bộ câu hỏi của vòng này</button>
      <span class="sub">Nạp lại sẽ thay thế toàn bộ bộ câu hỏi của vòng này</span>
    </div>
    <div class="msg" id="pmsg"></div>
  </div>

  <h2>Câu hỏi trong vòng <span id="rname" class="tag"></span></h2>
  <div class="card">
    <table><thead><tr><th class="mono">query</th><th>loại</th><th>mô tả</th>
      <th>CSV submission</th><th></th></tr></thead><tbody id="qtb"></tbody></table>
    <div id="empty" class="sub">chưa có câu hỏi nào</div>
  </div>
</div>
<input type="file" id="csvfile" accept=".csv,text/csv" hidden>
<script src="app.js"></script>
<script>
let ROUND = '', ROUNDS = [], QS = [], SUBS = {}, pendingQid = '';

function paintRounds(){
  const box = S('#rsw'); box.innerHTML = '';
  ROUNDS.forEach(r => {
    const b = document.createElement('button');
    b.type = 'button'; b.textContent = r.label;
    b.setAttribute('aria-pressed', r.id === ROUND);
    b.onclick = () => { ROUND = r.id; paintRounds(); loadQs(); };
    box.appendChild(b);
  });
  S('#rname').textContent = (ROUNDS.find(r => r.id === ROUND) || {}).label || ROUND;
}

function paintQs(){
  S('#empty').style.display = QS.length ? 'none' : '';
  const tb = S('#qtb'); tb.innerHTML = '';
  QS.forEach(q => {
    const tr = document.createElement('tr');
    tr.innerHTML = '<td class="mono"></td><td></td><td></td><td></td><td></td>';
    const td = tr.children;
    td[0].textContent = q.id;
    td[1].innerHTML = '<span class="tag ' + q.kind + '">' + q.kind + '</span>'
      + (q.events && q.events.length ? '<br><span class="sub">' + q.events.length + ' mốc</span>' : '');
    td[2].textContent = (q.text || '').slice(0, 180);
    const has = (SUBS[q.id] || []);
    const wrap = document.createElement('div');
    wrap.className = 'row';
    const lbl = document.createElement('span');
    lbl.className = 'sub'; lbl.textContent = has.length ? has.join(', ') : 'chưa có';
    const up = document.createElement('button');
    up.className = 'btn'; up.textContent = '⬆ CSV';
    up.onclick = () => { pendingQid = q.id; S('#csvfile').click(); };
    wrap.appendChild(lbl); wrap.appendChild(up);
    if(has.length){
      const dc = document.createElement('button');
      dc.className = 'btn danger'; dc.textContent = '🗑 CSV';
      dc.title = 'Xoá các CSV đang gắn vào câu này';
      dc.onclick = () => delSubs(q.id, has);
      wrap.appendChild(dc);
    }
    td[3].appendChild(wrap);

    const dq = document.createElement('button');
    dq.className = 'btn danger'; dq.textContent = '🗑 Xoá câu';
    dq.onclick = () => delQuery(q, has);
    td[4].appendChild(dq);
    tb.appendChild(tr);
  });
}

async function loadQs(){
  const j = await jget('/api/queries?round=' + encodeURIComponent(ROUND));
  QS = j.queries || []; SUBS = j.subs || {};
  paintRounds(); paintQs();
}

S('#parse').onclick = async () => {
  const text = S('#raw').value.trim();
  if(!text){ say('#pmsg', 'chưa dán gì cả', 'err'); return; }
  S('#parse').disabled = true;
  try{
    const j = await jpost('/api/queries', {round: ROUND, text});
    const s = j.summary;
    say('#pmsg', 'tách được ' + s.total + ' câu — '
      + Object.entries(s.by_kind).map(([k,v]) => v + ' ' + k).join(', '), 'ok');
    await loadQs();
  }catch(e){ say('#pmsg', e.message, 'err'); }
  S('#parse').disabled = false;
};

async function delSubs(qid, subs){
  let detail = '';
  for(const s of subs){
    try{
      const im = await jget('/api/sub/impact?name=' + encodeURIComponent(s));
      const who = Object.entries(im.markers || {});
      detail += '· ' + s + ' (' + im.rows + ' dòng'
        + (who.length ? ', đã chấm: ' + who.map(([w,n]) => w + ' ' + n).join(', ') : '')
        + ')\n';
    }catch(e){ detail += '· ' + s + '\n'; }
  }
  if(!confirm('Xoá ' + subs.length + ' CSV gắn vào ' + qid + '?\n\n' + detail
      + '\nMọi đánh dấu của cả nhóm trên các file này cũng mất.\nKhông hoàn tác được.')) return;
  try{
    for(const s of subs) await jpost('/api/sub/delete', {name: s});
    say('#pmsg', 'đã xoá ' + subs.length + ' CSV của ' + qid, 'ok');
    await loadQs();
  }catch(e){ say('#pmsg', e.message, 'err'); }
}

async function delQuery(q, subs){
  let msg = 'Xoá câu ' + q.id + '?\n\n';
  if(subs.length){
    msg += 'Câu này đang có ' + subs.length + ' CSV: ' + subs.join(', ') + '\n\n'
         + 'OK  = xoá câu VÀ xoá luôn các CSV đó (mất cả đánh dấu)\n'
         + 'Huỷ = không làm gì\n\n'
         + 'Muốn giữ CSV thì bấm Huỷ, dùng nút "🗑 Xoá câu" sau khi đã tách CSV ra.';
  }else{
    msg += 'Câu này chưa có CSV nào.';
  }
  msg += '\n\nKhông hoàn tác được.';
  if(!confirm(msg)) return;
  try{
    const j = await jpost('/api/query/delete',
      {round: ROUND, query_id: q.id, with_subs: subs.length > 0});
    say('#pmsg', 'đã xoá ' + q.id
      + (j.deleted_subs.length ? ' và ' + j.deleted_subs.length + ' CSV' : '')
      + ' — còn ' + j.remaining + ' câu', 'ok');
    await loadQs();
  }catch(e){ say('#pmsg', e.message, 'err'); }
}

S('#wipe').onclick = async () => {
  let im;
  try{ im = await jget('/api/queries/impact?round=' + encodeURIComponent(ROUND)); }
  catch(e){ say('#pmsg', e.message, 'err'); return; }
  if(!im.queries){ say('#pmsg', 'vòng này chưa có bộ câu hỏi nào để xoá', 'err'); return; }

  const lbl = (ROUNDS.find(r => r.id === ROUND) || {}).label || ROUND;
  let warn = 'Xoá bộ câu hỏi của ' + lbl + '?\n\n'
    + '· ' + im.queries + ' câu hỏi sẽ bị xoá\n'
    + '· ' + im.assignments + ' phân công sẽ bị xoá'
    + (im.people.length ? ' (' + im.people.join(', ') + ')' : '') + '\n';
  if(im.linked_subs.length){
    warn += '· ' + im.linked_subs.length + ' CSV đang gắn vào bộ này sẽ GIỮ NGUYÊN,\n'
          + '  nạp lại đúng bộ đó thì chúng tự nối lại.\n';
  }
  warn += '\nKhông hoàn tác được.';
  if(!confirm(warn)) return;

  try{
    const j = await jpost('/api/queries/delete', {round: ROUND});
    say('#pmsg', 'đã xoá ' + j.deleted_queries + ' câu và '
      + j.deleted_assignments + ' phân công của ' + lbl, 'ok');
    S('#raw').value = '';
    await loadQs();
  }catch(e){ say('#pmsg', e.message, 'err'); }
};

S('#csvfile').onchange = async ev => {
  const f = ev.target.files[0]; ev.target.value = '';
  if(!f || !pendingQid) return;
  const name = prompt('Tên cho submission này:', pendingQid + '-' + f.name.replace(/\.csv$/i,''));
  if(name === null) return;
  try{
    const r = await api('/api/upload?name=' + encodeURIComponent(name)
      + '&query_id=' + encodeURIComponent(pendingQid)
      + '&round=' + encodeURIComponent(ROUND),
      {method:'POST', headers:{'Content-Type':'text/csv'}, body: f});
    const j = await r.json();
    if(!j.ok){ say('#pmsg', j.error, 'err'); return; }
    say('#pmsg', 'đã gắn ' + j.meta.rows + ' dòng vào ' + pendingQid, 'ok');
    await loadQs();
  }catch(e){ say('#pmsg', e.message, 'err'); }
};

(async () => {
  if(!await guard(true)) return;
  const j = await jget('/api/round');
  ROUND = j.round; ROUNDS = j.rounds;
  await loadQs();
})();
</script></body></html>
